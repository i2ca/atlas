## Path central dos dados do veiculo
SET LOG_NAME=log_emp-2026-10-23_20-04-18
SET LOG_PATH=/dados/logs_emp/${LOG_NAME}.txt
SET PATH_CENTRAL=../data/empilhadeira_sim
SET GEO_PATH=${PATH_CENTRAL}/geodata/${LOG_NAME}
SET MAP_FILES_PATH=${GEO_PATH}/map_files
SET MAP_FILES_PATH_L1=${GEO_PATH}/map_files_l1
SET GRAPH=${PATH_CENTRAL}/graphs/rddf_emp.gr
SET ANNOTATIONS=${PATH_CENTRAL}/rddf/annotations.txt
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters_ini_new/astro.ini

# module name         group_name    requested_state    watch_heartbeats    command_line

#### servicos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message 't 0'
 proccontrol_gui     support       1        0          ./proccontrol_gui
 mss                 support       1        0          ./mss -level0 ${MAP_FILES_PATH} -level1 ${MAP_FILES_PATH_L1}

#### localizacao
 gps_xyz             localize      1        0          ./gps_xyz
 base_ackerman       localize      1        0          ./base_ackerman
 fused_odometry      localize      1        0          ./fused_odometry
 localize            localize      1        0          ./localize_ackerman -lidar 0
 mapper              localize      1        0          ./mapper -map_path ${MAP_FILES_PATH} -mapper_lidar1 on -mapper_lidar2 on -mapper_lidar3 on
 od_mapper           localize      1        0          ./obstacle_distance_mapper

#### rddf
 rddf_build          rddf          0        0          bash -c 'mkdir -p ../data/empilhadeira_sim/rddf && exec ./rddf_build -prefix rddf_emp -save_dir ../data/empilhadeira_sim/rddf'

#### planners
 route_planner       planner       0        0          ./route_planner --graph ${GRAPH} ${ANNOTATIONS}
 offroad_planner     planner       0        0          ./offroad_planner
 behavior_selector   planner       0        0          ./behavior_selector
 MPP                 planner       0        0          ./mpp

#### comando e monitoramento
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_FILES_PATH} -annotation_path ${ANNOTATIONS}
 viewer_3D           monitors      1        0          env __GL_SYNC_TO_VBLANK=0 vblank_mode=0 ./viewer_3D

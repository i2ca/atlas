## Path central dos dados do veiculo
SET PATH_CENTRAL=../data/empilhadeira_sim
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters_ini_new/astro.ini
SET DBC_PATH=${PATH_CENTRAL}/parameters_ini_new/empilhadeira.dbc
SET BRIDGE_CONFIG=$ASTRO_HOME/data/empilhadeira_sim/parameters_ini_new/can_bridge.yaml
SET ROS2_DISTRO=lyrical
SET GL_ENV=__NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json
SET FORKLIFT_WS=$HOME/atlas/ros2/forklift_sim_ws
SET CAN_IF=vcan0
SET GZ_WORLD=port
SET GEO_NAME=teste_2
SET MAP_FILES_PATH=${PATH_CENTRAL}/geodata/${GEO_NAME}/map_files
SET SC_LIO_SAM_MAP_PATH=$ASTRO_HOME/data/empilhadeira_sim/geodata/${GEO_NAME}/sc_lio_sam/
SET WORLD_ORIGIN=${SC_LIO_SAM_MAP_PATH}map_world_origin.txt
SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters_ini_new/param.yaml
SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0

# module name         group_name    requested_state    watch_heartbeats    command_line

#### servicos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 proccontrol_gui     support       1        0          ./proccontrol_gui
 logger              support       0        0          bash -c 'mkdir -p /dados/logs_emp && exec ./logger /dados/logs_emp/log_emp-$(date +%Y-%m-%d_%H-%M-%S).txt'

#### empilhadeira simulada (lado do veiculo)
 can_simulator       forklift      1        0          xterm -T forklift_can_simulator -geometry 150x12 -e ./forklift_can_simulator -can ${CAN_IF} -dbc ${DBC_PATH}
 gazebo              forklift      1        0          env ${GL_ENV} bash -c 'source /opt/ros/${ROS2_DISTRO}/setup.bash && source ${FORKLIFT_WS}/install/setup.bash && exec ros2 launch forklift_sim sim.launch.py world:=${GZ_WORLD} camera:=free can_interface:=${CAN_IF} bridge_config:=${BRIDGE_CONFIG} lidar:=true lidar_vstep_deg:=1.0 extra_lidars:="1 2 3 4" extra_lidar_vstep_deg:=0.75 extra_lidar_rate:=20 cameras:=true astro_ini:=${PARAM_DAEMON_PATH}'

 lidar0              sensors       1        0          ./forklift_lidar_sim -lidar_id 0
 lidar1              sensors       1        0          ./forklift_lidar_sim -lidar_id 1 -rate 20
 lidar2              sensors       1        0          ./forklift_lidar_sim -lidar_id 2 -rate 20
 lidar3              sensors       1        0          ./forklift_lidar_sim -lidar_id 3 -rate 20
 lidar4              sensors       1        0          ./forklift_lidar_sim -lidar_id 4 -rate 20
 gz_pose             sensors       1        0          ./forklift_gz_pose
 camera_1            sensors       1        0          ./camera_drivers intelbras1 1 -undistort off
 camera_2            sensors       1        0          ./camera_drivers intelbras2 2 -undistort off
 camera_3            sensors       1        0          ./camera_drivers intelbras3 3 -undistort off

#### localizacao
 mss                 localize      1        0          ./mss -level0 ${MAP_FILES_PATH}
 gps_xyz             localize      1        0          ./gps_xyz
 base_ackerman       localize      1        0          ./base_ackerman
 localize            localize      1        0          ./localize_ackerman -mapping_mode on -lidar 0
 rddf_build          localize      0        0          bash -c 'mkdir -p ../data/empilhadeira_sim/rddf && exec ./rddf_build -prefix rddf_emp -save_dir ../data/empilhadeira_sim/rddf'
 mapper              localize      1        0          ./mapper -map_path ${MAP_FILES_PATH}
 ros_bridge          ros           1        0          bash -c 'source ../src/sc_lio_sam/devel/setup.bash && exec roslaunch astro_ipc_bridge astro_ipc_bridge.launch lidar_sensor_id:=0 gps_nrs:="[1]" use_sim_time:=false > caco_bridge.txt'
 SC-LIO-SAM          ros           1        0          bash -c 'sleep 1 && source ../src/sc_lio_sam/devel/setup.bash && exec roslaunch lio_sam run.launch localizationMode:=true gpu:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=false > caco_sclio.txt'
 fused_odom_slam     ros           1        0          bash -c 'source ../src/sc_lio_sam/devel/setup.bash && exec rosrun astro_ipc_bridge fused_odometry_from_slam_node _world_origin_file:=${WORLD_ORIGIN} > caco_fused.txt 2>&1'

#### astro (computador de bordo)
 vehicle_driver      robot         1        0          ./ford_escape_hybrid_dbc -robot_model_name 3
 forklift_driver     robot         1        0          ./forklift_driver -can ${CAN_IF} -dbc ${DBC_PATH} -clamp_tx on -require_autonomous off

#### comando e monitoramento
 forklift_gui        interface     1        0          ./forklift_gui -can ${CAN_IF} -dbc ${DBC_PATH}
 clamp_teleop        interface     0        0          xterm -T teleop -geometry 80x20 -e ./forklift_clamp_teleop
 ipc_tools           monitors      0        0          ./ipc_tools
 camera_pinca        monitors      1        0          ./camera_viewer intelbras3 3
 viewer_3D           monitors      0        0          env ${GL_ENV} __GL_SYNC_TO_VBLANK=0 vblank_mode=0 ./viewer_3D

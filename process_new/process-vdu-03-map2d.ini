## Path central dos dados do veiculo
SET LOG_NAME=log_emp-2026-10-23_20-04-18
SET LOG_PATH=/dados/logs_emp/${LOG_NAME}.txt
SET PATH_CENTRAL=../data/empilhadeira_sim
SET GEO_PATH=${PATH_CENTRAL}/geodata/${LOG_NAME}
SET MAP_FILES_PATH=${GEO_PATH}/map_files
SET MAP_FILES_PATH_L1=${GEO_PATH}/map_files_l1
SET POSES_PATH=${GEO_PATH}/sc_lio_sam/poses_opt.dat
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters_ini_new/astro.ini

# module name         group_name    requested_state    watch_heartbeats    command_line

#### servicos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message 't 0'
 proccontrol_gui     support       1        0          ./proccontrol_gui
 mss                 support       1        0          bash -c 'for d in ${MAP_FILES_PATH} ${MAP_FILES_PATH_L1}; do mkdir -p $d && { test -f $d/info.txt || cp ../src/graphslam/assets/info.txt $d/; }; done && exec ./mss -level0 ${MAP_FILES_PATH} -level1 ${MAP_FILES_PATH_L1}'

#### filtros
 gps_xyz             filter        1        0          ./gps_xyz
 base_ackerman       filter        1        0          ./base_ackerman

#### mapeamento
 localize            SLAM          0        0          ./localize_ackerman -mapping_mode on -lidar 0
 pub_poses           SLAM          1        0          bash -c 'P=${POSES_PATH}; test -s "$P" && test $(head -1 "$P" | wc -w) -eq 10 || { echo; echo "=== ERRO: $P ausente, vazio ou fora do formato de 10 colunas. ==="; echo "Rode a ETAPA 2 (process-vdu-02-sclio-poses.ini) e depois:"; echo "  cp /dados/sc_lio_sam_output/empilhadeira/poses_opt.dat $P"; echo; sleep 15; exit 1; }; exec ./graphslam_publish "$P" -poses_from lidar'
 mapper              SLAM          1        0          ./mapper -map_path ${MAP_FILES_PATH} -mapping_mode on -interpolate_by_globalpos on -mapper_lidar0_lfree -1.5
 mapper_l1           SLAM          1        0          ./mapper -map_path ${MAP_FILES_PATH_L1} -mapping_mode on -interpolate_by_globalpos on -level 1 -mapper_lidar0_lfree -1.5

#### comando e monitoramento
 navigator_gui       interface     1        0          ./navigator_gui2 -map_path ${MAP_FILES_PATH}
 viewer_3D           monitors      0        0          ./viewer_3D -fv_flag on

#### mapa completo
 complete_map        graphslam     0        0          bash -c './build_complete_map -map_path ${MAP_FILES_PATH}; echo "Programa concluido normalmente"; sleep 30m'
 complete_map_l1     graphslam     0        0          bash -c './build_complete_map -map_path ${MAP_FILES_PATH_L1}; echo "Programa concluido normalmente"; sleep 30m'

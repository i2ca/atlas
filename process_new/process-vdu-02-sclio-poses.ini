## Path central dos dados do veiculo
SET LOG_NAME=log_emp-2026-10-23_20-04-18
SET LOG_PATH=/dados/logs_emp/${LOG_NAME}.txt
SET PATH_CENTRAL=../data/empilhadeira_sim
SET GEO_PATH=${PATH_CENTRAL}/geodata/${LOG_NAME}
SET SC_LIO_SAM_MAP_PATH=$ASTRO_HOME/data/empilhadeira_sim/geodata/${LOG_NAME}/sc_lio_sam/
SET PARAM_DAEMON_PATH=${PATH_CENTRAL}/parameters_ini_new/astro.ini
SET PARAM_SC_LIO_SAM=${PATH_CENTRAL}/parameters_ini_new/param.yaml
SET LIDAR_SENSOR_ID=0
SET START_X= 0.0
SET START_Y= 0.0
SET START_Z= 0.0
SET START_ROLL= 0.0
SET START_PITCH= 0.0
SET START_THETA= 0.0

# module name         group_name    requested_state    watch_heartbeats    command_line

#### servicos de suporte
 param_daemon        support       1        0          ./param_daemon ${PARAM_DAEMON_PATH}
 playback            support       1        0          ./playback ${LOG_PATH}
 playback_control    support       1        0          ./playback_control -message 't 0'
 proccontrol_gui     support       1        0          ./proccontrol_gui

#### filtros
 gps_xyz             filter        1        0          ./gps_xyz
 base_ackerman       filter        1        0          ./base_ackerman

#### comando e monitoramento
 viewer_3D           monitors      1        0          ./viewer_3D -fv_flag on

#### SC-LIO-SAM
 ros_bridge          ros           1        0          bash -c 'source ../src/sc_lio_sam/devel/setup.bash && exec roslaunch astro_ipc_bridge astro_ipc_bridge.launch lidar_sensor_id:=${LIDAR_SENSOR_ID} gps_nrs:="[1]" use_sim_time:=true > caco_bridge.txt'
 SC-LIO-SAM          ros           1        0          bash -c 'mkdir -p /dados/sc_lio_sam_output/empilhadeira && sleep 1 && source ../src/sc_lio_sam/devel/setup.bash && exec roslaunch lio_sam run.launch localizationMode:=true gpu:=true params_file:=${PARAM_SC_LIO_SAM} savePCDDirectory:=${SC_LIO_SAM_MAP_PATH} initialPoseX:=${START_X} initialPoseY:=${START_Y} initialPoseZ:=${START_Z} initialPoseRoll:=${START_ROLL} initialPosePitch:=${START_PITCH} initialPoseYaw:=${START_THETA} use_sim_time:=true > caco_sclio.txt'
